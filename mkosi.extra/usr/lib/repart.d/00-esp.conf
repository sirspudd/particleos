# Fresh installs get the full 400M. The minimum is lower so that booting the
# built image itself works: its ESP is sized by mkosi.repart/00-esp.conf and
# is followed directly by /usr, so repart cannot grow it to 400M in place and
# would refuse to add the root partition at all.

[Partition]
Type=esp
Format=vfat
SizeMinBytes=300M
SizeMaxBytes=300M
