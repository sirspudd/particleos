# bootctl writes "default BananOS-*" only when this file is absent. That
# pattern matches the type #1 entries and not the UKIs sysupdate installs
# under EFI/Linux (BananOS_<version>_<arch>.efi). Leave the default unset
# so systemd-boot selects the newest entry and boot counting can run.

timeout 0
