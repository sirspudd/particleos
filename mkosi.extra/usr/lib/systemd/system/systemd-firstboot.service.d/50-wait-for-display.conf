# This runs before sysinit.target, possibly before udev has loaded the GPU
# driver. When the firmware sets up no framebuffer (e.g. a passed through GPU
# without its option ROM) the prompt is invisible until then, so wait a bit
# for a display. Headless systems just continue after the timeout.

[Unit]
After=systemd-udev-trigger.service

[Service]
ExecStartPre=-udevadm wait --timeout=15 /dev/dri/card0
