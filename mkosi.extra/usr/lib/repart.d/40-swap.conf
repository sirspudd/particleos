# Disk swap holds the hibernation image. The bananos profile also pages to
# it at runtime, behind zswap; other profiles page to zram, which systemd
# will not hibernate to. The initrd replaces this definition and pins the
# size to RAM. Weight= is only the fallback if that step does not run.

[Partition]
Type=swap
Format=swap
Weight=2
Encrypt=tpm2
FactoryReset=yes
Label=%M-swap
