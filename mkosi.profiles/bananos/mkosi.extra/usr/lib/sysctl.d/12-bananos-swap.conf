# The encrypted disk swap is the only swap device, with zswap in front of it
# (see the kernel command line), so most swapped pages stay compressed in RAM
# and only cold ones reach the disk.

# zswap makes swapping anonymous memory about as cheap as dropping file
# cache, so weigh them equally rather than favouring the cache
vm.swappiness = 100
# Swap-in from zswap and from SSD is cheap per page, so read-ahead would
# mostly decompress pages that are not needed
vm.page-cluster = 0
# Avoid bursts of reclaim after fragmentation events
vm.watermark_boost_factor = 0
# Wake kswapd earlier so reclaim happens in the background rather than as
# direct reclaim stalls in the faulting task
vm.watermark_scale_factor = 125
