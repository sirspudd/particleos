[zram0]
# Uncompressed capacity equal to RAM. Resident usage is the compressed size,
# so this does not consume all of physical memory. Above 100% the machine
# runs out of uncompressed RAM and freezes before zram is full, which keeps
# systemd-oomd from running.
zram-size = ram
compression-algorithm = zstd
# Above the kernel default (negative) used by the encrypted disk swap, so
# paging lands here and the disk swap stays empty for hibernation.
swap-priority = 100
