[Match]
Distribution=arch

[Content]
# linux-spudd-master is not in Arch's kernel package list, so Bootable=auto
# would skip the default initrd. The package installs vmlinuz under
# /usr/lib/modules/<version>/, which is what the UKI step looks for.
Bootable=yes
Splash=/usr/share/systemd/bootctl/splash-arch.bmp
Packages=
        # Basic tools we should always include
        # raided from kdelinux
        # in kde-utilities
        #yakuake
        #konsole

        #niri
        #noctalia
        # as soon as the 64 bit client exists
        #steam
        #steam-devices
        adobe-source-code-pro-fonts
        bat # Opinionated fancy cat
        brightnessctl
        btop
        byobu
        google-chrome-beta
        dbus-broker
        desktop-file-utils # desktop-file-validate and related useful tools
        distrobox
        dosfstools
        drm-info # for debugging KWin and other graphics issues
        duc-git
        # falkon pulls qt6-webengine (~80 MiB compressed for the core library
        # alone). Chrome is the browser we keep.
        #falkon
        fastfetch # For showing off on r/unixporn
        file
        gdisk
        git-delta
        goverlay
        gum
        hunspell-en_US
        iproute2 # Basic networking tools
        iw # Kernel-level wireless configuration
        iwd
        kitty
        less
        # Stock linux is replaced by linux-spudd-master. Bootable=yes above is
        # what keeps the initrd build from being skipped.
        #linux
        linux-spudd-master
        lshw # fancy hardware listing
        lsof
        mesa
        mimalloc
        nano
        neovide
        neovim
        networkmanager
        # Static CJK collections barely compress (~226 MiB in the usr partition
        # for every Sans and Serif weight). One Sans face is enough.
        # mkosi.postinst.chroot keeps NotoSansCJK-Regular.ttc and deletes the
        # rest before fc-cache.
        noto-fonts-cjk
        nvme-cli # NVMe SSD support tooling
        openssh
        pipewire-pulse
        #plasma
        plocate
        podman
        podman-compose
        power-profiles-daemon
        ripgrep
        rsync
        # scx-scheds is every scheduler (~37 MiB compressed). scx-tools depends
        # on it, so leaving scx-tools would pull the schedulers back in.
        #scx-scheds
        #scx-tools
        sddm
        spice-vdagent
        strace # instrument running executables
        # ~56 MiB compressed, and nothing else in the image depends on it.
        #telegram-desktop
        tio
        tree
        unzip # the `unzip` CLI unarchiving tool
        usbutils # `lsusb` and other useful troubleshooting tools
        uwsm
        virglrenderer
        virt-manager
        virtme-ng
        vlc
        vulkan-radeon
        vulkan-virtio
        wget
        wine
        wl-clipboard
        xdg-utils # xdg-open and other useful cross-desktop CLI tools
        xfsprogs
        zip # the `zip` CLI archiving tool
        zsh
        zsh-autosuggestions # zsh-like suggestions
        zsh-completions
        zsh-history-substring-search # zsh-like history search
        zsh-syntax-highlighting # zsh-like syntax highlighting
        zstd
        # asus zenbook 16 S bluetooth
        linux-firmware-mediatek
        # I dont like sudo but it is everywhere, and I appreciate not being prompted at even junction
        sudo
        # omarchy package list
        # aether is the only package that needs webkit2gtk (~45 MiB compressed).
        #aether
        #asdcontrol
        ## cliamp pulls yt-dlp, which pulls yt-dlp-ejs, which is the only reason
        ## deno is installed (~40 MiB compressed for the deno binary).
        ##cliamp
        #gpu-screen-recorder
        #herdr
        #hyprland-preview-share-picker
        #limine-mkinitcpio-hook
        #limine-snapper-sync
        #linux-firmware-cirrus
        #localsend
        ##mise-bin
        #omacalc
        #omacut
        #omarchy
        #omarchy-keyring
        #omarchy-nvim
        #omarchy-settings
        #omawrite
        #pinta
        #tensaku
        #tobi-try
        #ttf-ia-writer
        #ttf-jetbrains-mono-nerd-basic
        #ttfx
        #tzupdate
        ## ufw-docker depends on docker, which depends on containerd. Podman is
        ## already installed; the docker binaries alone are ~50 MiB compressed.
        ##ufw-docker
        #xdg-terminal-exec
        ## Yaru is an extra icon theme on top of breeze (~63 MiB installed).
        ##yaru-icon-theme
        ##yay

# Theme colors, neovim, and vscode files under /usr/share/omarchy/themes stay.
# The jpg/png wallpapers and preview images are ~110 MiB and barely compress.
RemoveFiles=
        /usr/share/omarchy/themes/*/backgrounds
        /usr/share/omarchy/themes/*/*.png
        /usr/share/omarchy/themes/*/*.jpg
        /usr/share/fonts/noto-cjk/NotoSansCJK-Thin.ttc
        /usr/share/fonts/noto-cjk/NotoSansCJK-Light.ttc
        /usr/share/fonts/noto-cjk/NotoSansCJK-DemiLight.ttc
        /usr/share/fonts/noto-cjk/NotoSansCJK-Medium.ttc
        /usr/share/fonts/noto-cjk/NotoSansCJK-Bold.ttc
        /usr/share/fonts/noto-cjk/NotoSansCJK-Black.ttc
        /usr/share/fonts/noto-cjk/NotoSerifCJK-ExtraLight.ttc
        /usr/share/fonts/noto-cjk/NotoSerifCJK-Light.ttc
        /usr/share/fonts/noto-cjk/NotoSerifCJK-Regular.ttc
        /usr/share/fonts/noto-cjk/NotoSerifCJK-Medium.ttc
        /usr/share/fonts/noto-cjk/NotoSerifCJK-SemiBold.ttc
        /usr/share/fonts/noto-cjk/NotoSerifCJK-Bold.ttc
        /usr/share/fonts/noto-cjk/NotoSerifCJK-Black.ttc
        /usr/include
        /usr/share/man
        /usr/share/wallpapers
        /usr/share/doc

# breaks dep graph; use knife
#RemovePackages=
#        adwaita-icon-theme
#        adwaita-icon-theme-legacy
#        oxygen-icons
#        plasma-workspace-wallpapers
#        # cheerio baloo
#        baloo
#        adwaita-cursors
#        breeze-gtk
#        breeze-plymouth

RemovePackages=
         sddm
         sddm-kcm
         fish
         vim
         gvim
         vim-runtime
         plymouth
         breeze-plymouth
         plymouth-kcm
