[Content]
KernelCommandLine=
        # The encrypted disk swap is the only swap, with zswap in front of it.
        # zram would sit beside it and fill first, sending newly swapped pages
        # to disk while cold ones stay in RAM.
        systemd.zram=0
        zswap.enabled=1
        # Better ratio than lz4 for a few microseconds more per page.
        zswap.compressor=zstd
        # Up from 20%, zswap is the first swap tier rather than a small cache.
        zswap.max_pool_percent=25
        # Write cold compressed pages to disk before the pool fills, rather
        # than rejecting new ones once it is full.
        zswap.shrinker_enabled=1
        # Lower kernel latency under load than the default lazy preemption.
        preempt=full
