# Disk swap exists so hibernation has somewhere to write the memory image.
# zram is the swap used at runtime; systemd will not hibernate to it.
# The initrd replaces this definition and pins the size to RAM. Weight= is
# only the fallback if that step does not run.

[Partition]
Type=swap
Format=swap
Weight=2
Encrypt=tpm2
FactoryReset=yes
Label=%M-swap
