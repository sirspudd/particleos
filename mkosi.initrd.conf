[Content]
# WithDocs= only adds pacman NoExtract lines when mkosi generates pacman.conf.
# The bananos sandbox pacman.conf replaces that file, so those lines are never
# written. Remove the documentation trees here instead.
RemoveFiles=
        /usr/share/doc
        /usr/share/man
        /usr/share/groff
        /usr/share/gtk-doc
        /usr/share/info
