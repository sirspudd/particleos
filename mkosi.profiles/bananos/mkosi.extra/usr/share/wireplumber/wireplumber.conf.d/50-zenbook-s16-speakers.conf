# ASUS Zenbook S 16 UM5606WA. The speakers are a 4.0 device: tweeters in
# front, woofers in the rear. Prefer that profile, and keep the card's own
# sink below the upmix loopback (priority.session 1009) so playback uses the
# woofers. A Bluetooth sink is 1010 and still wins. A profile or sink saved
# from the volume applet is restored ahead of these rules.

device.profile.priority.rules = [
  {
    matches = [
      {
        device.name = "~alsa_card.pci-0000_c4_00.6$"
      }
    ]
    actions = {
      update-props = {
        priorities = [
          "output:analog-surround-40+input:analog-stereo"
          "analog-surround-40"
        ]
      }
    }
  }
]

monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_output.pci-0000_c4_00.6.*"
      }
    ]
    actions = {
      update-props = {
        priority.session = 1000
      }
    }
  }
]
