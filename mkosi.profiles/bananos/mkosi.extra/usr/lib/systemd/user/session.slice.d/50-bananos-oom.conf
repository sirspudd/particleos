[Slice]
# KWin and plasmashell run here. A pressure kill picks the cgroup reclaiming
# the most, which can be KWin and would end the session, so leave pressure
# kills to app.slice and background.slice. ManagedOOMPreference=avoid does
# not help, oomd only honours it on root-owned cgroups.
ManagedOOMMemoryPressure=auto
