# ASUS Zenbook S 16 UM5606WA: PipeWire maps tweeters to front and woofers to
# rear on the Analog Surround 4.0 profile. This loopback upmixes stereo to all
# four channels so the woofers get signal.
#
# After boot: set the card to "Analog Surround 4.0 Output + Analog Stereo Input"
# and use "Stereo to 4.0 upmix" as the default sink.
# If target.object does not match, check: pactl list short sinks

context.modules = [
    {   name = libpipewire-module-loopback
        args = {
            node.description = "Stereo to 4.0 upmix"
            audio.position = [ FL FR ]
            capture.props = {
                node.name = "sink.upmix_4_0"
                media.class = "Audio/Sink"
            }
            playback.props = {
                node.name = "playback.upmix-4.0"
                audio.position = [ FL FR RL RR ]
                target.object = "alsa_output.pci-0000_c4_00.6.analog-surround-40"
                stream.dont-remix = true
                node.passive = true
                channelmix.upmix = true
                channelmix.upmix-method = simple
            }
        }
    }
]
