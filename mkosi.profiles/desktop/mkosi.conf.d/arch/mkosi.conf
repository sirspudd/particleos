[Match]
Distribution=arch

[Content]
Splash=/usr/share/systemd/bootctl/splash-arch.bmp
Packages=
        adobe-source-code-pro-fonts
        linux-firmware-amdgpu
        mesa
        modemmanager
        networkmanager
        noto-fonts
        pipewire-pulse
        # tuned-ppd provides the same D-Bus API and conflicts with this package.
        #power-profiles-daemon
        tuned-ppd
        sof-firmware
        # qemu-ga's guest-shutdown execs /sbin/shutdown; without it libvirt
        # falls back to an ACPI power key press, which Plasma intercepts.
        systemd-sysvcompat
        vulkan-radeon
        wpa_supplicant
