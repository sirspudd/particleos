# bootctl writes "default BananOS-*" only when this file is absent. That
# pattern matches the type #1 entries and not the UKIs sysupdate installs
# under EFI/Linux (BananOS_<version>_<arch>.efi).
#
# This file only lands on the ESP of the built image (USB stick, VM disk);
# systemd-sysinstall formats the target ESP empty and bootctl writes a fresh
# loader.conf there. Default to the live profile so a stick without room for
# the root partition boots something usable. Profile entries are named
# <lowercased UKI filename>@<profile ID>.

timeout 0
default *@live
